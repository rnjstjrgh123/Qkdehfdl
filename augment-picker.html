<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>증강 선택 - 증강 윷놀이</title><style>:root{color-scheme:dark;--gold:#e6c27d;--line:#63523a}*{box-sizing:border-box}body{margin:0;padding:22px;background:radial-gradient(circle at top,#35414d,#141922 70%);color:#f8f0df;font-family:system-ui,"Malgun Gothic",sans-serif}main{max-width:850px;margin:auto}h1{color:var(--gold)}.muted{color:#bac4d0;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,#26313f,#171e28);border:2px solid var(--line);border-radius:14px;padding:18px;text-align:left;cursor:pointer;min-height:155px;color:#fff3d9;font:inherit}.card:hover,.card:focus{border-color:var(--gold);outline:2px solid #e6c27d55}.card.selected{border-color:#7fd6a5;background:linear-gradient(145deg,#244536,#172a25)}.card h2{margin:0 0 8px;font-size:20px}.card p{margin:0;color:#d5deea;line-height:1.55}.badge{display:inline-block;border:1px solid #806c4b;border-radius:20px;padding:3px 9px;font-size:12px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}button.confirm{background:linear-gradient(#e6c58b,#9b7139);color:#20170c;font-weight:800;border:0;border-radius:9px;padding:13px 20px;min-height:46px;font:inherit;cursor:pointer}.status{color:#9ce6b4;min-height:24px}@media(max-width:560px){body{padding:12px}.cards{grid-template-columns:1fr}.card{min-height:120px}}</style></head><body><main><span class="badge">증강 윷놀이 온라인</span><h1>나의 증강 선택</h1><p class="muted">증강 하나를 선택한 뒤 <b>선택 확정</b>을 누르세요. 선택은 원래 게임 창으로 전달되고, 서버가 게임에 적용합니다.</p><div class="cards" role="group" aria-label="증강 목록"><button class="card" data-augment="fortune"><h2>🍀 행운의 윷</h2><p>윷/모 결과가 나올 가능성이 높아집니다.</p></button><button class="card" data-augment="capturer"><h2>⚔️ 포획왕</h2><p>상대 말을 잡으면 추가 윷 던지기 2회를 얻습니다.</p></button><button class="card" data-augment="guardian"><h2>🛡️ 수호 부적</h2><p>첫 포획을 한 번 방어합니다.</p></button><button class="card" data-augment="swift"><h2>💨 질주</h2><p>첫 출발 이동에 한 칸을 추가합니다.</p></button></div><div class="row"><button id="confirm" class="confirm" disabled>선택 확정</button><span id="status" class="status" role="status" aria-live="polite">먼저 증강을 선택하세요.</span></div><script>let selected=null,done=false;document.querySelectorAll('[data-augment]').forEach(b=>b.addEventListener('click',()=>{if(done)return;selected=b.dataset.augment;document.querySelectorAll('[data-augment]').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('confirm').disabled=false;document.getElementById('status').textContent='선택됨: '+b.querySelector('h2').textContent;}));document.getElementById('confirm').addEventListener('click',()=>{if(!selected||done)return;if(!window.opener||window.opener.closed){document.getElementById('status').textContent='원래 게임 창을 찾을 수 없습니다. 게임 창에서 이 선택창을 다시 열어 주세요.';return;}window.opener.postMessage({type:'augment-yutnori:choose',augment:selected},location.origin);done=true;document.getElementById('confirm').disabled=true;document.getElementById('status').textContent='선택을 게임에 전달했습니다. 서버 응답을 기다리는 중…';});window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='augment-yutnori:result'||!e.data.ok)return;document.getElementById('status').textContent='적용 완료! '+(document.querySelector('[data-augment="'+e.data.augment+'"] h2')?.textContent||'증강')+'이 게임에 적용되었습니다.';});</script></main></body></html>
